<app-desktop-topbar
  title="Gestión de Flota"
  subtitle="Administra los buques, su estado y sus asignaciones"
  userName="Gary Barreiro"
  userRole="Gerente General"
/>

<div class="fleet-toolbar">
  <div class="navi-search-pill-box">
    <ion-icon name="search-outline"></ion-icon>
    <input
      type="text"
      [ngModel]="fleetSearch()"
      (ngModelChange)="onFleetSearch($event)"
      placeholder="Buscar buque, capitán o ruta..."
    />
  </div>

  <button
    type="button"
    class="navi-primary-pill-btn"
    (click)="toastMessage.set('Formulario de asignación rápida disponible en módulo Admin / API.')"
  >
    <ion-icon name="add"></ion-icon>
    <span>Agregar</span>
  </button>
</div>

<div class="filter-pills-row">
  <button
    type="button"
    class="filter-pill"
    [class.is-active]="fleetFilter() === 'ALL'"
    (click)="fleetFilter.set('ALL')"
  >
    <span>Todos</span>
    <strong>{{ fleetCounts().ALL }}</strong>
  </button>
  <button
    type="button"
    class="filter-pill"
    [class.is-active]="fleetFilter() === 'EN RUTA'"
    (click)="fleetFilter.set('EN RUTA')"
  >
    <span>En ruta</span>
    <strong>{{ fleetCounts()['EN RUTA'] }}</strong>
  </button>
  <button
    type="button"
    class="filter-pill"
    [class.is-active]="fleetFilter() === 'EN PUERTO'"
    (click)="fleetFilter.set('EN PUERTO')"
  >
    <span>En puerto</span>
    <strong>{{ fleetCounts()['EN PUERTO'] }}</strong>
  </button>
  <button
    type="button"
    class="filter-pill"
    [class.is-active]="fleetFilter() === 'RETRASO CLIMA'"
    (click)="fleetFilter.set('RETRASO CLIMA')"
  >
    <span>Retraso</span>
    <strong>{{ fleetCounts()['RETRASO CLIMA'] }}</strong>
  </button>
  <button
    type="button"
    class="filter-pill"
    [class.is-active]="fleetFilter() === 'MANTENIMIENTO'"
    (click)="fleetFilter.set('MANTENIMIENTO')"
  >
    <span>Mantenimiento</span>
    <strong>{{ fleetCounts()['MANTENIMIENTO'] }}</strong>
  </button>
</div>

<div class="fleet-3-grid">
  @for (ship of filteredFleet(); track ship.id) {
    <article class="ship-card">
      <div class="ship-card-head">
        <div class="ship-icon-box">
          <ion-icon name="boat-outline"></ion-icon>
        </div>
        <div class="ship-title-col">
          <h3>{{ ship.name }}</h3>
          <span>{{ ship.type }} · {{ ship.capacityTn | number }} Tn</span>
        </div>
        <ion-badge class="navi-badge" [class]="getBadgeClass(ship.status)">
          {{ ship.status }}
        </ion-badge>
      </div>

      <p class="ship-route">{{ ship.route }}</p>
      <ion-progress-bar [value]="ship.progress" class="ship-progress"></ion-progress-bar>

      <div class="ship-card-foot">
        <div>
          <span>Capitán</span>
          <strong>{{ ship.captain }}</strong>
        </div>
        <div class="is-right">
          <span>ETA</span>
          <strong>{{ ship.eta }}</strong>
        </div>
      </div>
    </article>
  }
</div>

<ion-toast
  [isOpen]="toastMessage() !== null"
  [message]="toastMessage() ?? ''"
  [duration]="2200"
  position="top"
  color="primary"
  (didDismiss)="toastMessage.set(null)"
></ion-toast>
