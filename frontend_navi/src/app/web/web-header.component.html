<header class="web-header">
  <div class="header-inner">
    <a class="brand" routerLink="/servicios" (click)="open.set(null)" aria-label="NaviPort OceanTrack, inicio">
      <ion-icon [icon]="icons.boatOutline" aria-hidden="true"></ion-icon>
      <span>NaviPort <small>OceanTrack</small></span>
    </a>

    <nav class="primary-nav" aria-label="Navegación principal" (pointerleave)="leave($event)" (focusout)="leaveFocus($event)">
      @for (group of groups(); track group.name; let index = $index) {
        <div (pointerenter)="show($event, group.name)">
          <button class="nav-trigger" type="button" [attr.aria-expanded]="open() === group.name"
            [attr.aria-controls]="id + '-' + index" (click)="toggle(group.name)">
            {{ group.name }} <ion-icon [icon]="icons.chevronDown" aria-hidden="true"></ion-icon>
          </button>
          <div class="nav-panel" [id]="id + '-' + index" [hidden]="open() !== group.name">
            @for (link of group.links; track link.path) {
              <a [routerLink]="link.path" routerLinkActive="current" [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page" (click)="open.set(null)">
                <ion-icon [icon]="link.icon" aria-hidden="true"></ion-icon>
                <span><strong>{{ link.title }}</strong><small>{{ link.summary }}</small></span>
                <ion-icon [icon]="icons.arrowForward" aria-hidden="true"></ion-icon>
              </a>
            }
          </div>
        </div>
      }
    </nav>

    <div class="account-actions">
      @if (portal()) {
        <button class="account secondary" type="button" (click)="signOut()">Cerrar sesión</button>
      } @else {
        @if (!session()) {
          <a class="account secondary" routerLink="/servicios" [queryParams]="{ acceso: 'registro' }" (click)="open.set(null)">Registrarse</a>
        }
        <a class="account primary" routerLink="/servicios" [queryParams]="{ acceso: 'login' }" (click)="open.set(null)">{{ session() ? 'Mi cuenta' : 'Acceder' }}</a>
      }
    </div>
  </div>
</header>
