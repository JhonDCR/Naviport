version: '3.8'

services:
  # Base de Datos NoSQL
  mongodb:
    image: mongo:7.0
    container_name: naviport_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-naviport_secret_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-naviport}
    volumes:
      - mongo_data:/data/db
    networks:
      - naviport-network

  # Motor de Caché y Sesiones Rápidas
  redis:
    image: redis:7.2-alpine
    container_name: naviport_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redis_naviport_secret}"
    volumes:
      - redis_data:/data
    networks:
      - naviport-network

  # Interfaz Web para Inspeccionar MongoDB (Opcional, muy útil para el equipo)
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: naviport_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-naviport_secret_password}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      - mongodb
    networks:
      - naviport-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  naviport-network:
    driver: bridge
